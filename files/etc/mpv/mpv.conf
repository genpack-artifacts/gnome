# Default mpv configuration for genpack gnome artifact
#
# Tuned for NVIDIA GPUs (RTX 3060 etc.) on Wayland with proprietary driver.
# Hardware decoding via nvidia-vaapi-driver and/or nvdec should activate
# automatically for H.264/H.265/AV1 etc.
#
# If you want to force a specific decoder:
#   hwdec=nvdec          # NVIDIA NVDEC (often best on RTX 30/40 series)
#   hwdec=vaapi          # via nvidia-vaapi-driver
#
# See also: https://mpv.io/manual/master/

hwdec=auto
vo=gpu-next
gpu-api=vulkan

# Reasonable quality preset
profile=high-quality
